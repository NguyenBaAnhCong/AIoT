server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Gọi API cùng địa chỉ với giao diện -> không cần cấu hình CORS
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ứng dụng một trang: mọi đường dẫn khác trả về index.html để React Router xử lý
  location / {
    try_files $uri $uri/ /index.html;
  }

  # File build có hash trong tên -> cache lâu; index.html thì không cache
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /index.html { add_header Cache-Control "no-store"; }
}
