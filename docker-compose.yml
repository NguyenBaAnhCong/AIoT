# Edge-AIoT Biochar – môi trường phát triển
#   docker compose up -d db            -> chỉ chạy PostgreSQL (khuyến nghị khi dev)
#   docker compose up -d --build       -> chạy cả database + backend + giao diện (http://localhost:8080)
#   docker compose down -v             -> xóa toàn bộ, kể cả dữ liệu (để nạp lại từ đầu)
name: edge-aiot-biochar

services:
  db:
    image: postgres:16
    container_name: biochar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biochar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biochar_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-edge_aiot_biochar}
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Các file trong init/ chỉ chạy MỘT LẦN, khi volume pgdata còn trống
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: biochar-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-biochar}:${POSTGRES_PASSWORD:-biochar_dev_pw}@db:5432/${POSTGRES_DB:-edge_aiot_biochar}
      JWT_SECRET: ${JWT_SECRET:-doi-chuoi-nay-trong-file-env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MIGRATIONS_DIR: /migrations
      TRUST_PROXY: "1"                    # đứng sau nginx: lấy đúng IP người dùng
      DEV_DEFAULT_PASSWORD: ${DEV_DEFAULT_PASSWORD:-Biochar@2026}
      SEED_DEV_PASSWORDS: ${SEED_DEV_PASSWORDS:-true}   # đặt false khi triển khai thật
    volumes:
      - ./database/migrations:/migrations:ro
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build: ./frontend
    container_name: biochar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"      # mở http://localhost:8080

  # ---- TV2: bỏ dấu # khi gateway giả lập đã có Dockerfile (xem gateway-simulator/README.md) ----
  # gateway-simulator:
  #   build: ./gateway-simulator
  #   container_name: biochar-gateway
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   environment:
  #     API_URL: http://backend:4000/api/v1
  #     GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}

volumes:
  pgdata:
